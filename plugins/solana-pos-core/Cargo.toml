[package]
name = "solana-pos-core"
version = "0.1.0"
edition = "2021"
description = "ZeroClaw WASM Tier 3 Native Plugin for Solana POS Invoicing & Squads v4 Multisig Proposals"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = { version = "0.30.0", default-features = false, features = ["realloc", "macros"] }
pos-core-logic = { path = "pos-core-logic" }

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
