# ZeroClaw Configuration File for Solana Payment Terminal Agent

[agent]
name = "SolanaPOSAgent"
version = "1.0.0"
description = "Autonomous POS Payment Terminal & Invoicing Agent for Local Businesses on Solana"
log_level = "info"

[channels.telegram]
enabled = true
bot_token = "${TELEGRAM_BOT_TOKEN}"
webhook_url = "${TELEGRAM_WEBHOOK_URL}"
bot_secret_token = "${TELEGRAM_BOT_SECRET_TOKEN}"
stale_update_ttl_secs = 300 # Stale update TTL threshold in seconds (0 = disabled)
allowed_chat_ids = [] # Leave empty for public customer bot, or specify manager chat ID for admin commands
manager_chat_id = "${MANAGER_TELEGRAM_ID}"

[pos]
quick_receipt_amount = 200.0 # Default quick receipt POS amount
quick_receipt_currency = "UAH" # Default quick receipt currency

[solana]
rpc_url = "${SOLANA_RPC_URL}"
fallback_rpc_url = "${SOLANA_FALLBACK_RPC_URL}"
commitment = "confirmed" # Strictly enforced: "confirmed" or "finalized" (prevents block reorg vulnerabilities)
merchant_wallet = "${MERCHANT_WALLET_PUBKEY}"
refund_session_wallet = "${REFUND_SESSION_KEY}"
nonce_account = "${NONCE_ACCOUNT_PUBKEY}"
usdc_mint = "${USDC_MINT_ADDRESS}"
allow_local_rpc = false # Allow local HTTP RPC endpoints for dev testing

[squads_v4]
program_id = "SQDS4ep65T869rmQrGGsybZb26a6Uq3vig54W62pkhm"
multisig = "${SQUADS_MULTISIG_PUBKEY}"
vault = "${SQUADS_VAULT_PUBKEY}"

[security]
max_single_refund_usdc = 50.0
daily_refund_limit_usdc = 200.0
fiat_slippage_tolerance_pct = 1.0 # 1.0% tolerance for fiat exchange rate fluctuations during checkout
require_human_approval_for_refunds = true
strict_prompt_isolation = true
api_keys = ["your_api_key_1", "your_api_key_2"] # API keys for authenticated REST routes

[skills]
directory = "./skills"
auto_load = true

[sops]
directory = "./sops"
auto_load = true

[plugins]
enabled = true
directory = "./plugins"

[plugins.solana_pos_core]
path = "./plugins/solana-pos-core/target/wasm32-wasip2/release/solana_pos_core.wasm"
