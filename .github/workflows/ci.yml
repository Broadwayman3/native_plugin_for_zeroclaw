name: ZeroClaw Solana POS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "plugins/solana-pos-core"

      - name: Install Rust Toolchain & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Install WASI Wasm-Tools & ShellCheck
        run: |
          curl -sLf https://github.com/bytecodealliance/wasm-tools/releases/download/v1.216.0/wasm-tools-1.216.0-x86_64-linux.tar.gz | tar -xz
          sudo mv wasm-tools-1.216.0-x86_64-linux/wasm-tools /usr/local/bin/
          sudo apt-get update && sudo apt-get install -y shellcheck || true

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: ShellScript Static Security Analysis (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Initialize Environment
        run: ./scripts/setup.sh

      - name: Check Rust Code Formatting
        run: |
          cargo fmt --check --manifest-path pos-backend/Cargo.toml
          cargo fmt --check --manifest-path plugins/solana-pos-core/Cargo.toml

      - name: Run Cargo Clippy - pos-backend (Strict Static Analysis)
        run: cargo clippy --manifest-path pos-backend/Cargo.toml -- -D warnings

      - name: Run Cargo Clippy - solana-pos-core (WASM target)
        run: |
          cd plugins/solana-pos-core
          cargo clippy --target wasm32-wasip2 -- -D warnings
          cd - > /dev/null

      - name: Run Rust Unit & Property-Based Tests (pos-backend)
        run: cargo test --manifest-path pos-backend/Cargo.toml

      - name: Run Rust Unit & Property-Based Tests (pos-core-logic)
        run: cargo test --manifest-path plugins/solana-pos-core/pos-core-logic/Cargo.toml

      - name: Run Rust Unit & Property-Based Tests (solana-pos-core)
        run: |
          cd plugins/solana-pos-core
          cargo test --lib --release
          cd - > /dev/null

      - name: Build WASM Plugin to wasm32-wasip2
        run: ./scripts/build_wasm.sh

      - name: Validate WASI Component Specification via wasm-tools
        run: |
          wasm-tools validate plugins/solana-pos-core/target/wasm32-wasip2/release/solana_pos_core.wasm --features component-model

      - name: Run Complete 1-Command Automated Verification Pipeline
        run: ./scripts/verify_all.sh
