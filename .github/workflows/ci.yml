name: ZeroClaw Solana POS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Install WASI Wasm-Tools
        run: |
          curl -sLf https://github.com/bytecodealliance/wasm-tools/releases/download/v1.216.0/wasm-tools-1.216.0-x86_64-linux.tar.gz | tar -xz
          sudo mv wasm-tools-1.216.0-x86_64-linux/wasm-tools /usr/local/bin/

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Initialize Environment
        run: ./scripts/setup.sh

      - name: Check Rust Code Formatting
        run: |
          cd plugins/solana-pos-core
          cargo fmt --check
          cd -

      - name: Run Cargo Clippy (Strict Static Analysis)
        run: |
          cd plugins/solana-pos-core
          cargo clippy --target wasm32-wasip2 -- -D warnings
          cd -

      - name: Run Rust Unit & Property-Based Tests (proptest)
        run: |
          cd plugins/solana-pos-core
          cargo test --lib --release
          cd -

      - name: Build WASM Plugin to wasm32-wasip2
        run: ./scripts/build_wasm.sh

      - name: Validate WASI Component Specification via wasm-tools
        run: |
          wasm-tools validate plugins/solana-pos-core/target/wasm32-wasip2/release/solana_pos_core.wasm --features component-model

      - name: Validate JSON Schema & Context Truncation Engine
        run: python3 scripts/validators.py

      - name: Test Local SQLite POS API Backend & Nonce Pools
        run: python3 scripts/pos_backend.py --test

      - name: Run Security Audit & Prompt Injection Suite
        run: python3 scripts/test_prompt_inj.py

      - name: Run 110 Comprehensive Boundary & Stress Test Cases
        run: python3 scripts/test_boundary_cases.py

      - name: Run Complete 1-Command Automated Verification Pipeline
        run: ./scripts/verify_all.sh
