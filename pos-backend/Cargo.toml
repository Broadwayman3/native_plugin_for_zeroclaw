[package]
name = "pos-backend"
version = "1.0.0"
edition = "2021"
description = "ZeroClaw Solana POS REST API Backend (Axum + rusqlite)"

[lib]
name = "pos_backend"
path = "src/lib.rs"

[[bin]]
name = "pos-backend"
path = "src/main.rs"

[[test]]
name = "test_boundary"
path = "tests/mod.rs"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto/Encoding
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

# Regex & Unicode
regex = "1"
unicode-normalization = "0.1"

# i18n
once_cell = "1.19"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Environment
dotenvy = "0.15"

# IP/URL validation
ipnet = "2.9"
urlencoding = "2.1"
url = "2.5"

# Shared business logic
pos-core-logic = { path = "../plugins/solana-pos-core/pos-core-logic" }

[dev-dependencies]
tokio-test = "0.4"
